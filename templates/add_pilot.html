<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Pilot - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        /* Minimal style for checkbox group - could be moved to styles.css if needed */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            background-color: var(--color-primary-lighter);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-primary-light);
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 700px;">
            <div class="card-header text-center">
                <h1 class="card-title">Register New Pilot</h1>
            </div>
            <div class="card-body">
                <form action="/save_pilot" method="POST">
                    <div class="flex gap-md" style="flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>National ID / Employee ID (INT only)</label>
                            <input type="number" name="pilot_id" placeholder="Digits Only" required>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>Starting Date</label>
                            <input type="date" name="starting_date" required>
                        </div>
                    </div>

                    <div class="flex gap-md" style="flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>First Name</label>
                            <input type="text" name="first_name" required>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>Last Name</label>
                            <input type="text" name="last_name" required>
                        </div>
                    </div>

                    <div class="flex gap-md" style="flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>City (Optional)</label>
                            <input type="text" name="city" placeholder="Optional">
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>Street (Optional)</label>
                            <input type="text" name="street" placeholder="Optional">
                        </div>
                    </div>

                    <div class="flex gap-md" style="flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>House Number (Optional)</label>
                            <input type="number" name="number" placeholder="Optional">
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>Phone Number (Optional)</label>
                            <input type="tel" name="phone" placeholder="05X-XXXXXXX">
                        </div>
                    </div>

                    <div class="form-group mt-md">
                        <div class="checkbox-group">
                            <input type="checkbox" name="long_flight_cer" id="cer">
                            <label for="cer">Certified for Long Distance Flights</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-full mt-md">Register Pilot</button>
                    <div class="text-center mt-md">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost btn-sm">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
