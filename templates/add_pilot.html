<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Pilot - FLYTAU</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; }

        .form-input-custom {
            @apply w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none transition-all focus:bg-white focus:ring-2 focus:ring-[#007B8F] focus:border-transparent text-sm;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .section-header {
            @apply flex items-center gap-2 mb-4 mt-8 first:mt-0;
        }
        .section-header span { @apply text-[10px] font-bold text-[#007B8F] uppercase tracking-[0.2em]; }
        .section-header .line { @apply h-px bg-gray-100 flex-grow; }

        /* Custom Checkbox/Toggle Style */
        .certification-box {
            @apply flex items-center justify-between p-4 bg-emerald-50 border border-emerald-100 rounded-2xl cursor-pointer transition-all hover:bg-emerald-100/50;
        }
    </style>
</head>
<body class="min-h-screen py-12 px-4 flex items-center justify-center">
    <main class="w-full max-w-3xl">

        <div class="mb-6">
            <a href="{{ url_for('admin_dashboard') }}" class="text-[#007B8F] text-xs font-bold uppercase tracking-widest flex items-center mb-2 hover:opacity-70 transition-opacity">
                <span class="material-icons text-sm mr-1">arrow_back</span>
                Admin Dashboard
            </a>
        </div>

        <section class="card overflow-hidden">
            <div class="bg-[#0B253A] p-8 text-center text-white relative">
                <div class="w-16 h-16 bg-[#007B8F] rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <span class="material-icons text-3xl">badge</span>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">Register New Pilot</h1>
                <p class="text-blue-100/60 text-xs mt-2 uppercase tracking-widest">Human Resources Management</p>
            </div>

            <div class="p-8 md:p-10">
                <form action="/save_pilot" method="POST" class="space-y-6">

                    <div class="section-header">
                        <span>Employment Info</span>
                        <div class="line"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Employee ID (INT)</label>
                            <input type="number" name="pilot_id" placeholder="Digits only" class="form-input-custom" required>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Starting Date</label>
                            <input type="date" name="starting_date" class="form-input-custom" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">First Name</label>
                            <input type="text" name="first_name" placeholder="John" class="form-input-custom" required>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Last Name</label>
                            <input type="text" name="last_name" placeholder="Doe" class="form-input-custom" required>
                        </div>
                    </div>

                    <div class="section-header">
                        <span>Contact & Address</span>
                        <div class="line"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Phone Number</label>
                            <input type="tel" name="phone" placeholder="05X-XXXXXXX" class="form-input-custom">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">City</label>
                            <input type="text" name="city" placeholder="Optional" class="form-input-custom">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2 space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Street</label>
                            <input type="text" name="street" placeholder="Optional" class="form-input-custom">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">House Num.</label>
                            <input type="number" name="number" placeholder="Optional" class="form-input-custom">
                        </div>
                    </div>

                    <div class="section-header">
                        <span>Certifications</span>
                        <div class="line"></div>
                    </div>

                    <label for="cer" class="certification-box group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-emerald-600 shadow-sm group-hover:scale-110 transition-transform">
                                <span class="material-icons">public</span>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-emerald-900">Long Distance Certification</p>
                                <p class="text-[10px] text-emerald-700 opacity-70">Enables eligibility for transcontinental flights</p>
                            </div>
                        </div>
                        <br>
                        <input type="checkbox" name="long_flight_cer" id="cer" class="h-6 w-6 rounded-md border-emerald-200 text-emerald-600 focus:ring-emerald-500 cursor-pointer">
                    </label>

                    <div class="pt-8">
                        <button type="submit" class="w-full bg-[#007B8F] hover:bg-[#006677] text-white font-bold py-4 rounded-xl shadow-lg shadow-[#007B8F]/20 transition-all flex items-center justify-center gap-2 group">
                            <span class="material-icons text-sm group-hover:rotate-12 transition-transform">person_add</span>
                            Register Pilot to Fleet
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <p class="text-center text-gray-400 text-[10px] mt-8 uppercase tracking-[0.3em]">
            FLYTAU Human Resources Module • 2026
        </p>
    </main>
</body>
</html>
