<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ report_title }} - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="report-page">

    <div class="page-wrapper">
        <a href="/view_reports" class="back-btn">&larr; Back to Menu</a>

        <div class="chart-card">
            <h2 class="chart-title">{{ report_title }}</h2>

            {% if report_summary %}
            <div class="executive-summary">
                <h5>Executive Summary</h5>
                <p>{{ report_summary }}</p>
            </div>
            {% endif %}

            {% if chart_url %}
                <div class="image-container">
                    <img src="data:image/png;base64,{{ chart_url }}" alt="Chart" class="chart-img">
                </div>
            {% else %}
                <div class="no-data-msg">
                    No data available for this report at the moment.
                </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
