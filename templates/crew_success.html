<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Complete - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .header-success {
            background-color: {{ '#003366' if role == 'Pilot' else '#1e40af' }};
            color: white !important;
            padding: 25px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }
        .header-success h1 { color: white !important; margin: 0; font-size: 24px; }
        .summary-card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; max-width: 500px; margin: auto; margin-top: 50px; background: white; }
        .data-row { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #f1f5f9; }
        .label { color: #64748b; font-weight: 500; }
        .value { color: #0f172a; font-weight: bold; text-align: right; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-green { background-color: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .btn-home { background-color: #0066cc; color: white; display: block; text-align: center; padding: 14px; border-radius: 6px; text-decoration: none; font-weight: bold; margin: 20px; }
    </style>
</head>
<body style="background-color: #f5f7fa;">
    <main class="container">
        <section class="summary-card">
            <div class="header-success">
                <h1>✓ {{ role }} Registered</h1>
                <p style="margin-top: 5px; opacity: 0.9;">Successfully added to the system</p>
            </div>

            <div class="card-body">
                <div class="data-row">
                    <span class="label">Full Name:</span>
                    <span class="value">{{ name }}</span>
                </div>
                <div class="data-row">
                    <span class="label">Employee ID:</span>
                    <span class="value">#{{ member_id }}</span>
                </div>
                <div class="data-row">
                    <span class="label">Long Flight Cert:</span>
                    <span class="value">
                        {% if has_certification %}
                            <span class="badge badge-green">Certified</span>
                        {% else %}
                            <span class="badge" style="background:#f1f5f9;">N/A</span>
                        {% endif %}
                    </span>
                </div>
                <a href="{{ url_for('admin_dashboard') }}" class="btn-home">Back to Dashboard</a>
            </div>
        </section>
    </main>
</body>
</html>
