<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Complete - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--color-gray-200);
        }
        .data-row:last-of-type {
            border-bottom: none;
        }
        .data-label {
            color: var(--color-text-secondary);
            font-weight: var(--font-weight-medium);
        }
        .data-value {
            color: var(--color-text-primary);
            font-weight: var(--font-weight-bold);
            text-align: right;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-success {
            background-color: var(--color-success-light);
            color: var(--color-success);
            border: 1px solid var(--color-success);
        }
        .badge-neutral {
            background-color: var(--color-gray-100);
            color: var(--color-text-secondary);
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 500px;">
            <div class="card-header text-center">
                <h1 class="card-title">✓ {{ role }} Registered</h1>
                <p class="text-muted mb-sm">Successfully added to the system</p>
            </div>

            <div class="card-body">
                <div class="data-row">
                    <span class="data-label">Full Name:</span>
                    <span class="data-value">{{ name }}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Employee ID:</span>
                    <span class="data-value">#{{ member_id }}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Long Flight Cert:</span>
                    <span class="data-value">
                        {% if has_certification %}
                            <span class="badge badge-success">Certified</span>
                        {% else %}
                            <span class="badge badge-neutral">N/A</span>
                        {% endif %}
                    </span>
                </div>
                <div class="mt-lg">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-primary w-full">Back to Dashboard</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
