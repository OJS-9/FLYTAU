<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Steward - FLYTAU</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; }

        .form-input-custom {
            @apply w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none transition-all focus:bg-white focus:ring-2 focus:ring-[#007B8F] focus:border-transparent text-sm;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .section-header {
            @apply flex items-center gap-2 mb-4 mt-8 first:mt-0;
        }
        .section-header span { @apply text-[10px] font-bold text-[#007B8F] uppercase tracking-[0.2em]; }
        .section-header .line { @apply h-px bg-gray-100 flex-grow; }

        .certification-box {
            @apply flex items-center justify-between p-4 bg-sky-50 border border-sky-100 rounded-2xl cursor-pointer transition-all hover:bg-sky-100/50;
        }
    </style>
</head>
<body class="min-h-screen py-12 px-4 flex items-center justify-center">
    <main class="w-full max-w-3xl">

        <div class="mb-6">
            <a href="{{ url_for('admin_dashboard') }}" class="group inline-flex items-center text-gray-400 hover:text-[#007B8F] transition-colors font-bold text-xs uppercase tracking-widest">
                <span class="material-icons text-sm mr-2 transform group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Return to Dashboard
            </a>
        </div>

        <section class="card overflow-hidden">
            <div class="bg-[#0B253A] p-8 text-center text-white">
                <div class="w-16 h-16 bg-sky-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-sky-500/20">
                    <span class="material-icons text-3xl">groups</span>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">Register New Steward</h1>
                <p class="text-sky-100/60 text-xs mt-2 uppercase tracking-widest">Crew Management • In-Flight Service</p>
            </div>

            <div class="p-8 md:p-10">
                <form action="/save_steward" method="POST" class="space-y-6">

                    <div class="section-header">
                        <span>Staff Identification</span>
                        <div class="line"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Employee ID</label>
                            <input type="number" name="pilot_id" placeholder="National ID" class="form-input-custom" required>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Employment Start Date</label>
                            <input type="date" name="starting_date" class="form-input-custom" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">First Name</label>
                            <input type="text" name="first_name" class="form-input-custom" required>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Last Name</label>
                            <input type="text" name="last_name" class="form-input-custom" required>
                        </div>
                    </div>

                    <div class="section-header">
                        <span>Personal Contact</span>
                        <div class="line"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Phone Number</label>
                            <input type="tel" name="phone" placeholder="05X-XXXXXXX" class="form-input-custom">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">City</label>
                            <input type="text" name="city" class="form-input-custom">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2 space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Street</label>
                            <input type="text" name="street" class="form-input-custom">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">House No.</label>
                            <input type="number" name="number" class="form-input-custom">
                        </div>
                    </div>

                    <div class="section-header">
                        <span>Training Records</span>
                        <div class="line"></div>
                    </div>

                    <label for="cer" class="certification-box group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-sky-600 shadow-sm group-hover:scale-110 transition-transform">
                                <span class="material-icons">public</span>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-sky-900">Long Distance Certified</p>
                                <p class="text-[10px] text-sky-700 opacity-70">Qualified for flights exceeding 6 hours</p>
                            </div>
                        </div>
                        <br>
                        <input type="checkbox" name="long_flight_cer" id="cer" class="h-6 w-6 rounded-md border-sky-200 text-sky-600 focus:ring-sky-500 cursor-pointer">
                    </label>

                    <div class="pt-8 space-y-4">
                        <button type="submit" class="w-full bg-[#007B8F] hover:bg-[#006677] text-white font-bold py-4 rounded-xl shadow-lg shadow-[#007B8F]/20 transition-all flex items-center justify-center gap-2">
                            <span class="material-icons">how_to_reg</span>
                            Register Steward
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <p class="text-center text-gray-400 text-[10px] mt-8 uppercase tracking-[0.3em]">
            FLYTAU Operations • Human Resources Registry • 2026
        </p>
    </main>
</body>
</html>
