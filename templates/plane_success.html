<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aircraft Registered - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-md) 0;
            border-bottom: 1px solid var(--color-gray-200);
        }
        .data-row:last-of-type {
            border-bottom: none;
        }
        .data-label {
            color: var(--color-text-secondary);
            font-weight: var(--font-weight-medium);
        }
        .data-value {
            color: var(--color-text-primary);
            font-weight: var(--font-weight-bold);
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 500px;">
            <div class="card-header text-center">
                <h1 class="card-title">✓ Aircraft Registered</h1>
                <p class="text-muted mb-sm">Successfully added to fleet</p>
            </div>

            <div class="card-body">
                <div class="data-row">
                    <span class="data-label">Aircraft ID:</span>
                    <span class="data-value">#{{ plane_id }}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Manufacturer:</span>
                    <span class="data-value">{{ manufacturer }}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Business Class:</span>
                    <span class="data-value">{{ bus_cap }} Seats</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Economy Class:</span>
                    <span class="data-value">{{ eco_cap }} Seats</span>
                </div>
                <div class="alert alert-success mt-md">
                    <div class="flex justify-between">
                        <span class="text-primary" style="font-weight: var(--font-weight-semibold);">Total Capacity:</span>
                        <span class="text-primary" style="font-size: 1.1rem; font-weight: var(--font-weight-bold);">{{ total_cap }} Seats</span>
                    </div>
                </div>

                <div class="mt-lg">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-primary w-full">Return to Dashboard</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
