<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Management Reports - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="container">
        <div class="mt-lg">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost">← Back to Dashboard</a>
        </div>

        <section class="card mt-md m-auto" style="max-width: 600px;">
            <div class="card-header text-center">
                <h2 class="card-title">Management Reports</h2>
                <p class="text-muted">Select a report to view analytics and charts.</p>
            </div>

            <div class="card-body">
                <div class="flex flex-column gap-md">
                    <a href="{{ url_for('report_flight_occupancy') }}" class="btn btn-primary w-full text-left">
                        1. Average Flight Occupancy
                    </a>

                    <a href="{{ url_for('report_total_revenue') }}" class="btn btn-primary w-full text-left">
                        2. Total Revenue Analysis
                    </a>

                    <a href="{{ url_for('report_employee_hours') }}" class="btn btn-primary w-full text-left">
                        3. Employee Accumulated Flight Hours
                    </a>

                    <a href="{{ url_for('report_cancellation_rate') }}" class="btn btn-primary w-full text-left">
                        4. Cancellation Rate by Month
                    </a>

                    <a href="{{ url_for('report_aircraft_activity') }}" class="btn btn-primary w-full text-left">
                        5. Monthly Aircraft Activity Summary
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
