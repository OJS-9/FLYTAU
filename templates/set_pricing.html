<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 3: Flight Pricing - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .currency-input {
            position: relative;
            display: flex;
            align-items: center;
        }
        .currency-input span {
            position: absolute;
            left: var(--spacing-md);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-secondary);
            z-index: 1;
        }
        .currency-input input {
            width: 100%;
            padding-left: calc(var(--spacing-md) * 2 + 10px);
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 500px;">
            <div class="card-header text-center">
                <h1 class="card-title">Step 3: Ticket Pricing</h1>
            </div>

            <div class="card-body">
                <p class="text-muted text-center mb-lg">
                    Define seat prices for the route <strong>{{ origin }} ➔ {{ dest }}</strong>
                    using Aircraft <strong>#{{ plane_id }}</strong>.
                </p>

                <form action="/get_available_crew" method="POST">
                    <input type="hidden" name="origin" value="{{ origin }}">
                    <input type="hidden" name="dest" value="{{ dest }}">
                    <input type="hidden" name="departure_time" value="{{ departure_time }}">
                    <input type="hidden" name="plane_id" value="{{ plane_id }}">
                    <input type="hidden" name="plane_size" value="{{ plane_size }}">

                    <div class="card" style="background-color: var(--color-gray-50);">
                        <div class="card-body">
                            <div class="form-group">
                                <label>Economy Class Price</label>
                                <div class="currency-input">
                                    <span>$</span>
                                    <input type="number" name="economy_price" min="1" placeholder="Enter amount" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Business Class Price</label>
                                <div class="currency-input">
                                    <span>$</span>
                                    <input type="number" name="business_price" min="1" placeholder="Enter amount" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-md mt-lg">
                        <button type="submit" class="btn btn-primary" style="flex: 2;">Next: Assign Crew</button>
                        <a href="{{ url_for('manage_flights') }}" class="btn btn-ghost" style="flex: 1; text-align: center;">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
