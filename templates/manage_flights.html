<!DOCTYPE html>
<html lang="en">
<head>
    <title>Step 1: Define Flight Route - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .text-uppercase {
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 600px;">
            <div class="card-header">
                <h2 class="card-title">Step 1: Define Flight Route</h2>
                <p class="text-muted mb-sm">Enter the origin and destination codes. If the route is new, you will be prompted to define its details.</p>
            </div>

            <div class="card-body">
                <form action="/validate_route" method="POST">
                    <div class="flex gap-md" style="flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="origin">Origin Airport Code (IATA):</label>
                            <input type="text"
                                   id="origin"
                                   name="origin"
                                   class="text-uppercase"
                                   placeholder="e.g. TLV"
                                   maxlength="3"
                                   pattern="[A-Za-z]{3}"
                                   title="Please enter a 3-letter airport code"
                                   required>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="dest">Destination Airport Code (IATA):</label>
                            <input type="text"
                                   id="dest"
                                   name="dest"
                                   class="text-uppercase"
                                   placeholder="e.g. JFK"
                                   maxlength="3"
                                   pattern="[A-Za-z]{3}"
                                   title="Please enter a 3-letter airport code"
                                   required>
                        </div>
                    </div>

                    <div class="alert alert-info mt-md mb-lg">
                        <small><strong>Note:</strong> System will check if this path already exists in the database.</small>
                    </div>

                    <div class="flex justify-between items-center">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost">Cancel</a>
                        <button type="submit" class="btn btn-primary">Next: Validate Route</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
