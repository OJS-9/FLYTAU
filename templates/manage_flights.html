<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 1: Define Flight Route - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        /* הסרנו את ה-JavaScript והמצבים הכפולים כדי למנוע בלבול */
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 250px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        .btn-link {
            background: none;
            border: none;
            color: #007bff;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            font-size: 0.95rem;
            display: inline-block;
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 700px;">
            <div class="card-header text-center">
                <h1 class="card-title">Step 1: Define Flight Route</h1>
                <p class="text-muted">Select a route from the existing list.</p>
            </div>

            <div class="card-body">
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="{{ url_for('create_new_path_manual') }}" class="btn-link">
                        + Path not in list? Add a new path manually
                    </a>
                </div>

                <form action="/validate_route" method="POST">
                    <div class="row mb-lg">
                        <div class="col">
                            <label class="form-label">Origin Airport:</label>
                            <select name="origin" class="form-control" required>
                                <option value="" disabled selected>Select Origin...</option>
                                {% for airport in airports %}
                                    <option value="{{ airport }}">{{ airport }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col">
                            <label class="form-label">Destination Airport:</label>
                            <select name="dest" class="form-control" required>
                                <option value="" disabled selected>Select Destination...</option>
                                {% for airport in airports %}
                                    <option value="{{ airport }}">{{ airport }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="alert alert-info mb-lg" style="background: #e7f3ff; padding: 10px; border-radius: 5px;">
                        <small><strong>Note:</strong> Only registered routes are shown above.</small>
                    </div>

                    <button type="submit" class="btn btn-primary w-full">Continue to Schedule</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
