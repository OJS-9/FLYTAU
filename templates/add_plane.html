<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Plane - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 700px;">
            <div class="card-header text-center">
                <h1 class="card-title">Add New Aircraft</h1>
            </div>
            <div class="card-body">
                <form action="/save_plane" method="POST">
                    <div class="form-group">
                        <label>Manufacturer</label>
                        <select name="manufacturer" required>
                            <option value="">Select Manafacturer</option>
                            <option value="Boeing">Boeing</option>
                            <option value="Airbus">Airbus</option>
                            <option value="Dassault">Dassault</option>
                    </div>

                    <div class="form-group">
                        <label>Aircraft Size</label>
                        <select name="size" required>
                            <option value="">Select Size</option>
                            <option value="Large">Large</option>
                            <option value="Small">Small</option>
                        </select>
                    </div>

                    <div class="flex gap-md" style="flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>Economy Class Capacity</label>
                            <input type="number" name="eco_cap" min="1" placeholder="Number of seats" required>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>Business Class Capacity</label>
                            <input type="number" name="bus_cap" min="1" placeholder="Number of seats" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Purchase Date</label>
                        <input type="date" name="purchase_date" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-full mt-md">Add Aircraft</button>
                    <div class="text-center mt-md">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost btn-sm">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
