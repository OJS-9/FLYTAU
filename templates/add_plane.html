<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Plane - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Visual feedback for disabled input */
        input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 700px;">
            <div class="card-header text-center">
                <h1 class="card-title">Add New Aircraft</h1>
            </div>
            <div class="card-body">
                <form action="/save_plane" method="POST" id="addPlaneForm">
                    <div class="form-group">
                        <label>Manufacturer</label>
                        <select name="manufacturer" required>
                            <option value="">Select Manufacturer</option>
                            <option value="Boeing">Boeing</option>
                            <option value="Airbus">Airbus</option>
                            <option value="Dassault">Dassault</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Aircraft Size</label>
                        <select name="size" id="aircraftSize" required>
                            <option value="">Select Size</option>
                            <option value="Large">Large (Economy & Business)</option>
                            <option value="Small">Small (Economy Only)</option>
                        </select>
                    </div>

                    <div class="flex gap-md" style="flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label>Economy Class Capacity</label>
                            <input type="number" name="eco_cap" min="1" placeholder="Number of seats" required>
                        </div>
                        <div class="form-group" id="businessGroup" style="flex: 1; min-width: 200px;">
                            <label>Business Class Capacity</label>
                            <input type="number" name="bus_cap" id="busCap" min="0" placeholder="Number of seats" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Purchase Date</label>
                        <input type="date" name="purchase_date" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-full mt-md">Add Aircraft</button>
                    <div class="text-center mt-md">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost btn-sm">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
        const sizeSelect = document.getElementById('aircraftSize');
        const busInput = document.getElementById('busCap');

        sizeSelect.addEventListener('change', function() {
            if (this.value === 'Small') {
                busInput.value = 0;
                busInput.disabled = true;
                // Ensure value is sent even if disabled by creating a hidden field or re-enabling on submit
            } else {
                busInput.disabled = false;
                if (busInput.value === "0") {
                    busInput.value = "";
                }
            }
        });

        // Ensure bus_cap is sent if size is Small (disabled fields aren't sent by default)
        document.getElementById('addPlaneForm').addEventListener('submit', function() {
            busInput.disabled = false;
        });
    </script>
</body>
</html>
