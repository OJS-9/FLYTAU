<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Aircraft - FLYTAU</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; }

        .form-input-custom {
            @apply w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none transition-all focus:bg-white focus:ring-2 focus:ring-[#007B8F] focus:border-transparent text-sm;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }


        .input-disabled {
            @apply bg-gray-100 cursor-not-allowed opacity-50 grayscale;
        }

        .section-label {
            @apply text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 block ml-1;
        }
    </style>
</head>
<body class="min-h-screen py-12 px-4 flex items-center justify-center">
    <main class="w-full max-w-2xl">

        <div class="mb-6">
            <a href="{{ url_for('admin_dashboard') }}" class="group inline-flex items-center text-gray-400 hover:text-[#007B8F] transition-colors font-bold text-xs uppercase tracking-widest">
                <span class="material-icons text-sm mr-2 transform group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Back to Dashboard
            </a>
        </div>

        <section class="card overflow-hidden">
            <div class="bg-[#0B253A] p-8 text-center text-white">
                <div class="w-16 h-16 bg-[#007B8F]/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="material-icons text-3xl text-[#007B8F]">airplanemode_active</span>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">Add New Aircraft</h1>
                <p class="text-blue-100/60 text-xs mt-2 uppercase tracking-widest">Fleet Expansion Registry</p>
            </div>

            <div class="p-8 md:p-10">
                <form action="/save_plane" method="POST" id="addPlaneForm" class="space-y-6">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="section-label">Manufacturer</label>
                            <div class="relative">
                                <select name="manufacturer" class="form-input-custom appearance-none" required>
                                    <option value="" disabled selected>Select Manufacturer</option>
                                    <option value="Boeing">Boeing</option>
                                    <option value="Airbus">Airbus</option>
                                    <option value="Dassault">Dassault</option>
                                </select>
                                <span class="material-icons absolute right-3 top-3 text-gray-400 pointer-events-none text-sm">business</span>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="section-label">Configuration Type</label>
                            <div class="relative">
                                <select name="size" id="aircraftSize" class="form-input-custom appearance-none" required>
                                    <option value="" disabled selected>Select Size</option>
                                    <option value="Large">Large (Double Class)</option>
                                    <option value="Small">Small (Economy Only)</option>
                                </select>
                                <span class="material-icons absolute right-3 top-3 text-gray-400 pointer-events-none text-sm">straighten</span>
                            </div>
                        </div>
                    </div>

                    <div class="ticket-divider border-t border-dashed border-gray-100 my-8"></div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="p-4 bg-blue-50/50 rounded-2xl border border-blue-100/50 space-y-3">
                            <label class="section-label text-blue-500 flex items-center">
                                <span class="material-icons text-xs mr-1">weekend</span> Economy Class
                            </label>
                            <input type="number" name="eco_cap" min="1" placeholder="Number of seats" class="form-input-custom" required>
                        </div>

                        <div id="businessGroup" class="p-4 bg-purple-50/50 rounded-2xl border border-purple-100/50 space-y-3 transition-all">
                            <label class="section-label text-purple-500 flex items-center">
                                <span class="material-icons text-xs mr-1">stars</span> Business Class
                            </label>
                            <input type="number" name="bus_cap" id="busCap" min="0" placeholder="Number of seats" class="form-input-custom" required>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="section-label">Purchase Date</label>
                        <div class="relative">
                            <input type="date" name="purchase_date" class="form-input-custom" required>
                            <span class="material-icons absolute right-3 top-3 text-gray-400 pointer-events-none text-sm">calendar_today</span>
                        </div>
                    </div>

                    <div class="pt-6">
                        <button type="submit" class="w-full bg-[#007B8F] hover:bg-[#006677] text-white font-bold py-4 rounded-xl shadow-lg shadow-[#007B8F]/20 transition-all flex items-center justify-center gap-2 group">
                            <span class="material-icons text-sm">add</span>
                            Register Aircraft
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <p class="text-center text-gray-400 text-[10px] mt-8 uppercase tracking-[0.3em]">
            FLYTAU Fleet Management • Assets Module
        </p>
    </main>

    <script>
        const sizeSelect = document.getElementById('aircraftSize');
        const busInput = document.getElementById('busCap');
        const busGroup = document.getElementById('businessGroup');

        sizeSelect.addEventListener('change', function() {
            if (this.value === 'Small') {
                busInput.value = 0;
                busInput.disabled = true;
                busGroup.classList.add('input-disabled');
            } else {
                busInput.disabled = false;
                busGroup.classList.remove('input-disabled');
                if (busInput.value === "0") {
                    busInput.value = "";
                }
            }
        });

        document.getElementById('addPlaneForm').addEventListener('submit', function() {
            busInput.disabled = false; // Ensure value is sent to server
        });
    </script>
</body>
</html>
