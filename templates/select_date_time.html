<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 2: Schedule Flight - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 550px;">
            <div class="card-header text-center">
                <h1 class="card-title">Step 2: Scheduling</h1>
                <div class="badge-route" style="background: #e7f3ff; padding: 8px; border-radius: 4px; display: inline-block; margin-top: 10px;">
                    <strong>{{ origin }} ✈ {{ dest }}</strong>
                </div>
                <p class="text-muted mt-md">Route confirmed. Select the departure local time.</p>
            </div>

            <div class="card-body">
                <form id="scheduleForm" action="/get_available_resources" method="POST" class="flex flex-column gap-md">
                    <input type="hidden" name="origin" value="{{ origin }}">
                    <input type="hidden" name="dest" value="{{ dest }}">

                    <div class="form-group mb-lg">
                        <label style="color: #003366; font-weight: bold; display: block; margin-bottom: 8px;">
                            Departure Date & Time (Local)
                        </label>
                        <input type="datetime-local" id="departure_input" name="departure_time" class="form-control" required>
                        <p id="current-time-msg" class="text-muted" style="font-size: 0.8rem; margin-top: 5px;">
                            Current system date: Jan 13, 2026
                        </p>
                    </div>

                    <div class="flex gap-md mt-lg" style="display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary" style="flex: 2;">Next: Check Availability</button>
                        <a href="{{ url_for('manage_flights') }}" class="btn btn-ghost" style="flex: 1; text-align: center; line-height: 2.5;">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
        const dateInput = document.getElementById('departure_input');

        // פונקציה שמחזירה את הזמן הנוכחי בפורמט שמתאים ל-input (YYYY-MM-DDTHH:mm)
        function getNowString() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            return now.toISOString().slice(0, 16);
        }

        // הגדרת מינימום בלוח השנה למניעת בחירת עבר
        dateInput.min = getNowString();

        document.getElementById('scheduleForm').onsubmit = function(e) {
            const selected = dateInput.value;
            const now = getNowString();

            if (!selected || selected <= now) {
                alert("⚠️ Error: Departure time must be in the future!");
                e.preventDefault();
                return false;
            }
        };
    </script>
</body>
</html>
