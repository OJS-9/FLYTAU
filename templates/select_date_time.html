<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 2: Schedule Flight - FLYTAU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="container">
        <section class="card mt-xl m-auto" style="max-width: 550px;">
            <div class="card-header text-center">
                <h1 class="card-title">Step 2: Scheduling</h1>
            </div>

            <div class="card-body">
                <div class="alert alert-info text-center mb-lg">
                    <div style="font-size: 1.4rem; font-weight: bold;">
                        {{ origin }} <span class="text-primary">✈</span> {{ dest }}
                    </div>
                </div>
                <p class="text-muted text-center mb-lg">Route confirmed. Select the departure local time.</p>

                <form id="scheduleForm" action="/get_available_resources" method="POST" class="flex flex-column gap-md">
                    <input type="hidden" name="origin" value="{{ origin }}">
                    <input type="hidden" name="dest" value="{{ dest }}">

                    <div class="form-group">
                        <label>Departure Date & Time</label>
                        <input type="datetime-local" id="departure_input" name="departure_time" required>
                        <p id="current-time-msg" class="text-muted" style="font-size: 0.8rem; margin-top: 5px;">Today is: Dec 31, 2025</p>
                    </div>

                    <div class="flex gap-md mt-lg">
                        <button type="submit" class="btn btn-primary" style="flex: 2;">Next: Check Availability</button>
                        <a href="{{ url_for('manage_flights') }}" class="btn btn-ghost" style="flex: 1; text-align: center;">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
        const dateInput = document.getElementById('departure_input');

        // פונקציה שמחזירה מחרוזת זמן מקומי בפורמט שהדפדפן דורש (YYYY-MM-DDTHH:mm)
        function getNowString() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            return new Date(now - offset).toISOString().slice(0, 16);
        }

        // הגדרת המינימום בלוח השנה
        dateInput.min = getNowString();

        // חסימה בזמן שליחה
        document.getElementById('scheduleForm').onsubmit = function(e) {
            const selected = dateInput.value; // מחרוזת בפורמט YYYY-MM-DDTHH:mm
            const now = getNowString();

            if (selected <= now) {
                alert("⚠️ Error: Departure time must be in the future.\n\nToday is Dec 31, 2025. You cannot select Jan 1, 2025 because it already passed!");
                e.preventDefault();
                return false;
            }
        };
    </script>
</body>
</html>
